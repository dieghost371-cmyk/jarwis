<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>JARVIS</title>
<style>
:root{--bg:#05070d;--ink:#d8f3ff;--dim:#6f8aa0;--cy:#27e1ff;--am:#ffb347;--line:#12202e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 2px}
h1{font-size:18px;letter-spacing:.35em;font-weight:600;color:var(--cy)}
.btns{display:flex;gap:8px}
.ib{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px}
.ib.on{border-color:var(--cy);color:var(--cy)}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(78vw,52vh);height:min(78vw,52vh);touch-action:manipulation}
#cam{position:absolute;right:0;top:6px;width:96px;height:128px;object-fit:cover;border-radius:12px;border:1px solid var(--cy);display:none;background:#000}
#state{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:var(--dim);font-size:13px}
#log{height:26vh;overflow-y:auto;padding:8px 2px;font-size:15px;line-height:1.45}
.m{margin:6px 0}.u{color:var(--am)}.a{color:var(--ink)}
#bar{display:flex;gap:8px;padding:8px 0 12px}
#txt{flex:1;background:#0a111b;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px}
#go{background:var(--cy);color:#001018;border:0;border-radius:12px;padding:0 18px;font-weight:700}
#set{position:fixed;inset:0;background:#05070df2;display:none;padding:24px;overflow:auto;z-index:5}
#set.show{display:block}
#set label{display:block;margin:16px 0 6px;color:var(--dim);font-size:13px}
#set input,#set select,#set textarea{width:100%;background:#0a111b;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px;font-size:15px}
#set p{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>JARVIS</h1>
    <div class="btns">
      <button class="ib" id="camBtn">Camera</button>
      <button class="ib" id="flipBtn">Flip</button>
      <button class="ib" id="setBtn">Settings</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="orb" width="600" height="600"></canvas>
    <video id="cam" playsinline muted></video>
    <div id="state">Orb eka tap karala kathakarana</div>
  </div>
  <div id="log"></div>
  <div id="bar">
    <input id="txt" placeholder="Type karanna puluwan..." autocomplete="off">
    <button id="go">Send</button>
  </div>
</div>

<div id="set">
  <h1 style="margin-bottom:8px">Settings</h1>
  <label>Google AI Studio (Gemini) API key</label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <p>Key eka save wenne oyage phone eke witarai. Code ekata ho GitHub ekata yanne na. Google Cloud console eke key eka oyage GitHub Pages link ekata witarai restrict karanna.</p>
  <label>Model</label>
  <input id="model" value="gemini-2.5-flash">
  <label>Bhashawa (voice)</label>
  <select id="lang"><option value="si-LK">Sinhala</option><option value="en-US">English</option></select>
  <label>Owner</label>
  <input id="owner" value="Ghost">
  <label><input type="checkbox" id="loop" checked style="width:auto"> Reply eka passe auto listen</label>
  <button class="ib" id="save" style="margin-top:22px;width:100%;padding:13px">Save</button>
</div>

<script>
const $=id=>document.getElementById(id);
const S={key:'',model:'gemini-2.5-flash',lang:'si-LK',owner:'Ghost',loop:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('jv2')||'{}'))}catch(e){}
function paint(){$('key').value=S.key;$('model').value=S.model;$('lang').value=S.lang;$('owner').value=S.owner;$('loop').checked=S.loop}
paint();
$('setBtn').onclick=()=>$('set').classList.add('show');
$('save').onclick=()=>{S.key=$('key').value.trim();S.model=$('model').value.trim();S.lang=$('lang').value;S.owner=$('owner').value.trim()||'Ghost';S.loop=$('loop').checked;
  try{localStorage.setItem('jv2',JSON.stringify(S))}catch(e){}
  $('set').classList.remove('show');if(rec)rec.lang=S.lang};
if(!S.key)$('set').classList.add('show');

/* ---------- Orb ---------- */
const cv=$('orb'),cx=cv.getContext('2d');let mode='idle',t=0;
let fx=0,fy=0,tx=0,ty=0;
function draw(){
  t+=.02;const W=600,c=W/2;cx.clearRect(0,0,W,W);fx+=(tx-fx)*.08;fy+=(ty-fy)*.08;cx.save();cx.translate(fx,fy);
  const amp={idle:6,listen:22,think:12,speak:30}[mode];
  const col=mode==='speak'?'255,179,71':'39,225,255';
  for(let r=0;r<4;r++){
    cx.beginPath();
    for(let a=0;a<=Math.PI*2+.05;a+=.04){
      const rad=120+r*28+Math.sin(a*(3+r)+t*(mode==='think'?4:1.6)+r)*amp*(1-r*.15)+(mode==='speak'?Math.sin(t*9+r)*8:0);
      const x=c+Math.cos(a)*rad,y=c+Math.sin(a)*rad;a?cx.lineTo(x,y):cx.moveTo(x,y);
    }
    cx.strokeStyle=`rgba(${col},${.9-r*.2})`;cx.lineWidth=2.4-r*.4;cx.stroke();
  }
  const g=cx.createRadialGradient(c,c,4,c,c,110);
  g.addColorStop(0,`rgba(${col},.55)`);g.addColorStop(1,`rgba(${col},0)`);
  cx.fillStyle=g;cx.beginPath();cx.arc(c,c,110,0,7);cx.fill();
  cx.restore();requestAnimationFrame(draw);
}
draw();
function setMode(m,label){mode=m;$('state').textContent=label}

/* ---------- Camera ---------- */
let stream=null,facing='environment';
async function camOn(){
  try{
    if(stream)stream.getTracks().forEach(x=>x.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
    $('cam').srcObject=stream;$('cam').style.display='block';await $('cam').play();$('camBtn').classList.add('on');
  }catch(e){say('Camera access denied. Browser settings wala allow karanna.',false);stream=null}
}
function camOff(){if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;$('cam').style.display='none';$('camBtn').classList.remove('on')}
$('camBtn').onclick=()=>stream?camOff():camOn();
$('flipBtn').onclick=()=>{facing=facing==='environment'?'user':'environment';if(stream)camOn()};
function frame(){
  if(!stream)return null;const v=$('cam');if(!v.videoWidth)return null;
  const k=640/Math.max(v.videoWidth,v.videoHeight),c=document.createElement('canvas');
  c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.7).split(',')[1];
}

/* ---------- Face follow ---------- */
let fd=null;try{if(window.FaceDetector)fd=new FaceDetector({fastMode:true,maxDetectedFaces:1})}catch(e){}
setInterval(async()=>{
  if(!fd||!stream||!$('cam').videoWidth){tx=ty=0;return}
  try{
    const f=await fd.detect($('cam'));
    if(!f.length){tx=ty=0;return}
    const b=f[0].boundingBox,v=$('cam');
    let nx=((b.x+b.width/2)/v.videoWidth-.5)*2,ny=((b.y+b.height/2)/v.videoHeight-.5)*2;
    if(facing==='user')nx=-nx;
    tx=nx*70;ty=ny*70;
  }catch(e){}
},180);

/* ---------- Voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
if(SR){
  rec=new SR();rec.lang=S.lang;rec.interimResults=false;rec.continuous=false;
  rec.onresult=e=>{const s=e.results[0][0].transcript;listening=false;ask(s)};
  rec.onerror=()=>{listening=false;setMode('idle','Hari giye. Aye tap karanna')};
  rec.onend=()=>{if(listening){listening=false;setMode('idle','Orb eka tap karala kathakarana')}};
}
function listen(){
  if(!rec){say('Me browser eke voice input nane. Chrome use karanna.',false);return}
  speechSynthesis.cancel();rec.lang=S.lang;
  try{rec.start();listening=true;setMode('listen','Ahagena inne...')}catch(e){}
}
cv.onclick=()=>listening?rec.stop():listen();

function speak(text){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);u.lang=S.lang;
    const v=speechSynthesis.getVoices().find(x=>x.lang.replace('_','-').startsWith(S.lang.slice(0,2)));if(v)u.voice=v;
    u.rate=1;u.onstart=()=>setMode('speak','Kiyanawa...');u.onend=u.onerror=()=>{setMode('idle','Orb eka tap karala kathakarana');res()};
    speechSynthesis.cancel();speechSynthesis.speak(u);
  });
}
function add(cls,txt){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;$('log').appendChild(d);$('log').scrollTop=1e9}
async function say(text,voice=true){add('a',text);if(voice)await speak(text)}

/* ---------- Brain ---------- */
let hist=[];
const SYS=()=>`You are JARVIS, a personal voice assistant running on ${S.owner}'s phone. Your owner is ${S.owner}, age 15, a Free Fire content creator from Sri Lanka. If asked who made or owns you, say your owner is ${S.owner}.
Reply in the same language the user speaks: Sinhala (in Sinhala script) or English, or casual Singlish if they use it. Keep replies SHORT (1-2 sentences) because they are spoken aloud. No markdown, no emojis.
You can see through the phone camera when an image is attached; describe or answer about it naturally.
Commands: if the user wants a song or video played, add at the very end of your reply the tag [[YT:search query]] (song name and artist). Example: "Ok, playing it. [[YT:Kasun Kalhara Sandungira]]". If they ask to open a website, add [[OPEN:https://url]]. Only add tags when asked.`;

async function ask(q){
  q=q.trim();if(!q)return;add('u',q);
  if(!S.key){say('Settings wala API key eka danna.',false);$('set').classList.add('show');return}
  setMode('think','Hithanawa...');
  const img=frame(),parts=[];
  if(img)parts.push({inlineData:{mimeType:'image/jpeg',data:img}});
  parts.push({text:q});
  const contents=[...hist,{role:'user',parts}];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(S.model)+':generateContent',{method:'POST',headers:{
      'content-type':'application/json','x-goog-api-key':S.key},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents,generationConfig:{maxOutputTokens:400,thinkingConfig:{thinkingBudget:0}}})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error?.message||r.status);
    let out=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    hist.push({role:'user',parts:[{text:q}]},{role:'model',parts:[{text:out}]});hist=hist.slice(-12);
    const tags=[...out.matchAll(/\[\[(YT|OPEN):([^\]]+)\]\]/g)];
    out=out.replace(/\[\[[^\]]*\]\]/g,'').trim();
    if(out)await say(out);
    for(const m of tags){
      const url=m[1]==='YT'?'https://www.youtube.com/results?search_query='+encodeURIComponent(m[2].trim()):m[2].trim();
      window.open(url,'_blank');
    }
    if(S.loop&&!tags.length)listen();
  }catch(e){say('Error: '+e.message,false);setMode('idle','Aye try karanna')}
}
$('go').onclick=()=>{const v=$('txt').value;$('txt').value='';ask(v)};
$('txt').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
